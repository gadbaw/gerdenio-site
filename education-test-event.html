<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workflow Test — Gerdenio Manuel Center for Psychotherapy</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css?v=21" />
  <style>
    #webinar-form.is-sent .field, #webinar-form.is-sent button, #webinar-form.is-sent .hp { display: none; }
    .register-card { background: #fff; border: 1px solid var(--line); border-radius: 16px;
      padding: 32px; margin-top: 26px; max-width: 560px; }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <div class="brand">
        <a href="index.html">Gerdenio Manuel Center
          <small><span class="for">for</span><span class="disc">Psychotherapy</span></small>
        </a>
      </div>
    </nav>
  </header>

  <section class="hero" style="padding-bottom:36px;">
    <div class="wrap read">
      <p class="eyebrow">Internal · Workflow Test</p>
      <h1>GMCP Workflow <em>Test</em></h1>
      <p class="lede">An internal rehearsal of the webinar workflow — registration, confirmation email, Zoom join, cloud recording. Not a public event; this page is unlisted.</p>
      <p class="lede" style="margin-top:0;"><strong>Today · 11:30 AM Pacific · 30 minutes</strong></p>

      <div class="register-card" id="register">
        <h2 style="margin-top:0;">Test registration</h2>
        <form id="webinar-form" action="https://portal.gerdenio.com/webinar/test-2026-08-21/register" method="POST">
          <div class="field">
            <label for="reg-name">Name</label>
            <input type="text" id="reg-name" name="name" autocomplete="name" required />
          </div>
          <div class="field">
            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" name="email" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="reg-code">Registration code</label>
            <input type="text" id="reg-code" name="code" autocomplete="off" autocapitalize="characters" required />
          </div>
          <div class="hp" aria-hidden="true"><label>Leave this field empty<input type="text" name="website" tabindex="-1" autocomplete="off" /></label></div>
          <button type="submit" class="btn" id="webinar-submit">Register</button>
          <p class="form-status" id="webinar-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </section>

  <script>
  (function () {
    var form = document.getElementById('webinar-form');
    if (!form) return;
    var statusEl = document.getElementById('webinar-status');
    var btn = document.getElementById('webinar-submit');
    function setStatus(msg, kind) {
      statusEl.textContent = msg;
      statusEl.className = 'form-status' + (kind ? ' is-' + kind : '');
    }
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var label = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Registering…';
      fetch(form.action, {
        method: 'POST',
        headers: { 'Accept': 'application/json' },
        body: new FormData(form)
      }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
        .then(function (res) {
          if (res.ok && res.data.ok) {
            form.classList.add('is-sent');
            setStatus(res.data.message, 'success');
          } else {
            setStatus(res.data.error || 'Something went wrong — please try again.', 'error');
          }
        })
        .catch(function () { setStatus('Something went wrong — please try again.', 'error'); })
        .finally(function () { btn.disabled = false; btn.textContent = label; });
    });
  })();
  </script>
</body>
</html>
